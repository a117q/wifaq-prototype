[data-app="Academic"] .wf-dot.done.on{box-shadow:0 0 0 3px #18345D}
[data-app="Academic"] .wf-dot.todo{background:#fff;border:2px dashed #B9C4D4}
[data-app="Academic"] .wf-item:disabled{cursor:default}
[data-app="Academic"] .wf-item:disabled:hover{background:#fff}
[data-app="Academic"] .wf-empty{padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:#586378;font-size:15px}

[data-app="Academic"] .wf-pop{animation:Academic-wf-fade .25s ease}
@keyframes Academic-wf-out{to{opacity:0;visibility:hidden}}
@keyframes Academic-wf-draw{to{stroke-dashoffset:0}}
@keyframes Academic-wf-chk{to{clip-path:inset(0 0 0 0)}}
[data-app="Academic"] .wf-intro{position:absolute;inset:0;z-index:60;background:#fff;display:flex;flex-direction:column;align-items:center;padding-top:30vh;pointer-events:none;animation:Academic-wf-out .4s ease 1.5s forwards}
[data-app="Academic"] .wf-mark{position:relative;width:min(480px,80%);aspect-ratio:1216/296}
[data-app="Academic"] .wf-mark svg,[data-app="Academic"] .wf-mark img{position:absolute;inset:0;width:100%;height:100%;display:block}
[data-app="Academic"] .wf-line{stroke-dasharray:1;stroke-dashoffset:1;animation:Academic-wf-draw 1s cubic-bezier(.65,0,.35,1) .1s forwards}

to-fit, minmax(220px, 1fr)); gap: 14px\">\n                <div style=\"padding: 14px; border-radius: 10px; background: #F4F6F9\"><dt style=\"font-size: 13px; color: #586378\">التخصصات المطلوبة<\/dt><dd style=\"margin: 4px 0 0; font-size: 15px; font-weight: 600\">{{op.majorsLabel}}<\/dd><\/div>\n                <div style=\"padding: 14px; border-radius: 10px; background: #F4F6F9\"><dt style=\"font-size: 13px; color: #586378\">الحد الأدنى للمعدل<\/dt><dd style=\"margin: 4px 0 0; font-size: 15px; font-weight: 600\">{{op.minGpa}} من 5<\/dd><\/div>\n              <\/dl>\n              <span style=\"font-size: 14px; font-weight: 600\">المهارات المطلوبة<\/span>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 8px\"><template data-k=\"for\" list=\"{{op.skills}}\" as=\"k\" hint-placeholder-count=\"4\"><span class=\"wf-tag\">{{k.name}}<\/span><\/template><\/div>\n            <\/section>\n          <\/div>\n\n          <aside class=\"wf-card\" aria-label=\"درجة التوافق\" style=\"flex: 1 1 360px; min-width: 0; padding: 24px; display: flex; flex-direction: column; gap: 18px\">\n            <h2 class=\"wf-h2\">درجة توافقك<\/h2>\n            <template data-k=\"if\" value=\"{{op.scoreHidden}}\" hint-placeholder-val=\"{{ true }}\">\n              <p style=\"margin: 0; font-size: 15px; line-height: 1.9; color: #3D4A60\">تُحسب الدرجة بمقارنة تخصصك ومعدلك ومهاراتك بمتطلبات الفرصة وفق قواعد مطابقة محددة مسبقًا.<\/p>\n              <button type=\"button\" class=\"wf-btn wf-pri\" style=\"align-self: flex-start\" onClick=\"{{showScore}}\">عرض درجة التوافق<\/button>\n            <\/template>\n            <template data-k=\"if\" value=\"{{op.scoreShown}}\" hint-placeholder-val=\"{{ false }}\">\n              <div class=\"wf-pop\" style=\"display: flex; gap: 20px; align-items: center\">\n                <div style=\"position: relative; width: 128px; height: 128px; flex: 0 0 auto\">\n                  <svg role=\"img\" aria-label=\"{{op.scoreAria}}\" width=\"128\" height=\"128\" viewBox=\"0 0 128 128\" style=\"transform: rotate(-90deg)\"><circle cx=\"64\" cy=\"64\" r=\"54\" fill=\"none\" stroke=\"#E6EBF2\" stroke-width=\"12\"><\/circle><circle class=\"wf-ring\" cx=\"64\" cy=\"64\" r=\"54\" fill=\"none\" stroke=\"#098264\" stroke-width=\"12\" stroke-linecap=\"round\" stroke-dasharray=\"{{op.dash}}\"><\/circle><\/svg>\n                  <div style=\"position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center\"><strong style=\"font-size: 30px; color: #18345D; line-height: 1\">{{op.score}}٪<\/strong><span style=\"font-size: 12px; color: #586378\">توافق<\/span><\/div>\n                <\/div>\n                <p style=\"margin: 0; font-size: 14px; line-height: 1.8; color: #586378\">حققت <strong style=\"color: #16213A\">{{op.metText}}<\/strong> من متطلبات هذه الفرصة.<\/p>\n              <\/div>\n              <template data-k=\"if\" value=\"{{op.explHidden}}\" hint-placeholder-val=\"{{ true }}\"><button type=\"button\" class=\"wf-btn wf-gho\" style=\"align-self: flex-start\" onClick=\"{{showExpl}}\">طلب شرح الدرجة<\/button><\/template>\n            <\/template>\n            <template data-k=\"if\" value=\"{{op.explShown}}\" hint-placeholder-val=\"{{ false }}\">\n              <div class=\"wf-pop\" style=\"display: flex; flex-direction: column\">\n                <h3 style=\"margin: 0 0 6px; font-size: 16px; font-weight: 700\">لماذا هذه الدرجة؟<\/h3>\n                <template data-k=\"for\" list=\"{{op.criteria}}\" as=\"c\" hint-placeholder-count=\"6\">\n                  <div style=\"display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid #EEF1F5\">\n                    <template data-k=\"if\" value=\"{{c.met}}\" hint-placeholder-val=\"{{ true }}\"><span class=\"wf-ico\" role=\"img\" aria-label=\"متحقق\" style=\"background: #E6F2EE; color: #098264\"><svg aria-hidden=\"true\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg><\/span><\/template>\n                    <template data-k=\"if\" value=\"{{c.unmet}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"wf-ico\" role=\"img\" aria-label=\"غير متحقق\" style=\"background: #FDECEA; color: #A3241A\"><svg aria-hidden=\"true\" width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.8\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6 6 18\"><\/path><\/svg><\/span><\/template>\n                    <strong style=\"font-size: 14px\">{{c.label}}<\/strong>\n                  <\/div>\n                <\/template>\n              <\/div>\n            <\/template>\n          <\/aside>\n        <\/div>\n      <\/div>\n    <\/template>\n\n    <!-- ===================== طلباتي ===================== -->\n    <template data-k=\"if\" value=\"{{s.apps}}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"wf-pop\" style=\"display: flex; flex-direction: column; gap: 24px\">\n        <div style=\"display: flex; flex-direction: column; gap: 10px\">\n          <nav class=\"wf-crumb\" aria-label=\"مسار التنقل\"><a href=\"#\" onClick=\"{{goHome}}\">الرئيسية<\/a><span aria-hidden=\"true\">/<\/span><span aria-current=\"page\">طلباتي<\/span><\/nav>\n          <h1 class=\"wf-h1\">طلباتي<\/h1>\n          <span class=\"wf-bars\" aria-hidden=\"true\"><span><\/span><span><\/span><\/span>\n          <p class=\"wf-sub\">آخر حالة لكل طلب قدّمته. اختر طلبًا لعرض مراحله وتفاصيل القرار.<\/p>\n        <\/div>\n        <section style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 20px 24px; border-radius: 12px; background: {{taBox.bg}}; border: 1px solid {{taBox.border}}\">\n          <div style=\"flex: 1 1 360px; display: flex; flex-direction: column; gap: 4px\"><span style=\"font-size: 13px; font-weight: 600; color: #586378\">طلب التدريب التعاوني<\/span><strong style=\"font-size: 17px; color: #18345D\">{{taBox.title}}<\/strong><span style=\"font-size: 14px; line-height: 1.8; color: #3D4A60\">{{taBox.text}}<\/span><\/div>\n          <template data-k=\"if\" value=\"{{taBox.cta}}\" hint-placeholder-val=\"{{ true }}\"><a href=\"#\" class=\"wf-btn wf-grn\" onClick=\"{{goTA}}\">تقديم طلب التدريب<\/a><\/template>\n          <template data-k=\"if\" value=\"{{taBox.train}}\" hint-placeholder-val=\"{{ false }}\"><a href=\"#\" class=\"wf-btn wf-pri\" onClick=\"{{goTraining}}\">الانتقال إلى التدريب<\/a><\/template>\n        <\/section>\n        <section class=\"wf-card\" style=\"overflow: hidden\"><div style=\"overflow-x: auto\">\n          <table class=\"wf-table\">\n            <thead><tr><th scope=\"col\">الفرصة<\/th><th scope=\"col\">الجهة<\/th><th scope=\"col\">تاريخ التقديم<\/th><th scope=\"col\">الحالة<\/th><th scope=\"col\"><span class=\"wf-sr\">إجراء<\/span><\/th><\/tr><\/thead>\n            <tbody><template data-k=\"for\" list=\"{{apps}}\" as=\"a\" hint-placeholder-count=\"4\">\n              <tr style=\"background: {{a.rowBg}}\">\n                <td><strong style=\"color: #18345D; font-size: 15px\">{{a.title}}<\/strong><template data-k=\"if\" value=\"{{a.isNew}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"wf-status\" style=\"margin-right: 8px; background: #E6F2EE; color: #06654D; font-size: 11px; padding: 2px 8px\">جديد<\/span><\/template><\/td>\n                <td style=\"color: #3D4A60\">{{a.org}}<\/td><td style=\"color: #3D4A60\">{{a.date}}<\/td>\n                <td><span class=\"wf-status\" style=\"background: {{a.bg}}; color: {{a.fg}}\">{{a.status}}<\/span><\/td>\n                <td style=\"text-align: left\"><button type=\"button\" class=\"{{a.selCls}}\" aria-pressed=\"{{a.selected}}\" onClick=\"{{a.pick}}\">{{a.selLabel}}<\/button><\/td>\n              <\/tr>\n            <\/template><\/tbody>\n          <\/table>\n        <\/div><\/section>\n        <section class=\"wf-card\" aria-label=\"مراحل الطلب\" style=\"padding: 28px; display: flex; flex-direction: column; gap: 28px\">\n          <div style=\"display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline\"><h2 style=\"margin: 0; font-size: 20px; font-weight: 700; color: #18345D\">{{cur.title}}<\/h2><span style=\"font-size: 14px; color: #586378\">{{cur.org}}<\/span><\/div>\n          <ol style=\"list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px\">\n            <template data-k=\"for\" list=\"{{steps}}\" as=\"st\" hint-placeholder-count=\"4\">\n              <li style=\"display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; position: relative\">\n                <span aria-hidden=\"true\" style=\"position: absolute; top: 21px; right: 50%; width: calc(100% + 16px); height: 3px; background: {{st.line}}\"><\/span>\n                <span style=\"position: relative; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; background: {{st.bg}}; color: {{st.fg}}; border: {{st.border}}\">{{st.mark}}<\/span>\n                <strong style=\"font-size: 15px\">{{st.label}}<\/strong>\n                <span style=\"font-size: 13px; color: {{st.noteColor}}\">{{st.note}}<\/span>\n              <\/li>\n            <\/template>\n          <\/ol>\n          <div class=\"wf-note\" style=\"background: {{cur.boxBg}}; color: {{cur.boxFg}}\">\n            <span style=\"flex: 1 1 300px\">{{cur.decision}}<\/span>\n            <template data-k=\"if\" value=\"{{cur.canTA}}\" hint-placeholder-val=\"{{ false }}\"><a href=\"#\" class=\"wf-btn wf-grn\" onClick=\"{{goTA}}\">تقديمها طلبَ تدريب<\/a><\/template>\n            <template data-k=\"if\" value=\"{{cur.rejected}}\" hint-placeholder-val=\"{{ false }}\"><a href=\"#\" class=\"wf-btn wf-gho\" onClick=\"{{goOpps}}\">تصفّح فرصًا أخرى<\/a><\/template>\n          <\/div>\n        <\/section>\n      <\/div>\n    <\/template>\n\n    <!-- ===================== طلب التدريب ===================== -->\n    <template data-k=\"if\" value=\"{{s.ta}}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"wf-pop\" style=\"display: flex; flex-direction: column; gap: 24px\">\n        <div style=\"display: flex; flex-direction: column; gap: 10px\">\n          <nav class=\"wf-crumb\" aria-label=\"مسار التنقل\"><a href=\"#\" onClick=\"{{goHome}}\">الرئيسية<\/a><span aria-hidden=\"true\">/<\/span><span aria-current=\"page\">طلب التدريب<\/span><\/nav>\n          <h1 class=\"wf-h1\">تقديم طلب التدريب التعاوني<\/h1>\n          <span class=\"wf-bars\" aria-hidden=\"true\"><span><\/span><span><\/span><\/span>\n          <p class=\"wf-sub\">اختر فرصة واحدة من الفرص التي قبلتك، وأرسلها لمشرف التدريب الإداري لاعتمادها.<\/p>\n        <\/div>\n        <template data-k=\"if\" value=\"{{taView.choose}}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start\">\n            <section class=\"wf-card\" style=\"flex: 999 1 520px; min-width: 0; padding: 24px; display: flex; flex-direction: column; gap: 14px\">\n              <h2 class=\"wf-h2\">الفرص المقبولة<\/h2>\n              <template data-k=\"for\" list=\"{{taOptions}}\" as=\"o\" hint-placeholder-count=\"2\">\n                <label class=\"{{o.cls}}\"><input type=\"radio\" name=\"ta\" checked=\"{{o.checked}}\" onChange=\"{{o.pick}}\"><span style=\"display: flex; flex-direction: column; gap: 4px; flex: 1 1 auto\"><strong style=\"font-size: 16px; color: #18345D\">{{o.title}}<\/strong><span style=\"font-size: 14px; color: #3D4A60\">{{o.org}}<\/span><\/span><\/label>\n              <\/template>\n              <div style=\"display: flex; gap: 12px; flex-wrap: wrap; align-items: center; padding-top: 10px; border-top: 1px solid #EEF1F5\">\n                <button type=\"button\" class=\"wf-btn wf-grn wf-lg\" disabled=\"{{taView.noPick}}\" onClick=\"{{submitTA}}\">إرسال طلب التدريب<\/button>\n                <a href=\"#\" class=\"wf-btn wf-gho\" onClick=\"{{goApps}}\">إلغاء<\/a>\n              <\/div>\n            <\/section>\n            <aside class=\"wf-card\" style=\"flex: 1 1 300px; min-width: 0; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n              <h2 style=\"margin: 0; font-size: 17px; font-weight: 700; color: #18345D\">قبل الإرسال<\/h2>\n              <ul style=\"margin: 0; padding-right: 20px; font-size: 14px; line-height: 2; color: #3D4A60\"><li>يُقدَّم طلب تدريب واحد فقط.<\/li><li>تصبح حالته «قيد المراجعة» حتى يقرر مشرف التدريب الإداري.<\/li><li>إذا لم يُعتمد يمكنك اختيار فرصة مقبولة أخرى.<\/li><\/ul>\n            <\/aside>\n          <\/div>\n        <\/template>\n        <template data-k=\"if\" value=\"{{taView.sent}}\" hint-placeholder-val=\"{{ false }}\">\n          <section class=\"wf-card wf-pop\" role=\"status\" style=\"padding: 44px 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center\">\n            <span aria-hidden=\"true\" style=\"width: 68px; height: 68px; border-radius: 50%; background: #E6F2EE; color: #098264; display: flex; align-items: center; justify-content: center\"><svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg><\/span>\n            <h2 style=\"margin: 0; font-size: 22px; color: #18345D\">أُرسل طلب التدريب<\/h2>\n            <p style=\"margin: 0; max-width: 560px; font-size: 15px; line-height: 1.9; color: #3D4A60\">أرسلنا فرصة «{{taView.name}}» لمشرف التدريب الإداري، وحالتها الآن: <strong>قيد المراجعة<\/strong>.<\/p>\n            <a href=\"#\" class=\"wf-btn wf-pri\" onClick=\"{{goApps}}\">متابعة الحالة في طلباتي<\/a>\n          <\/section>\n        <\/template>\n        <template data-k=\"if\" value=\"{{taView.blocked}}\" hint-placeholder-val=\"{{ false }}\">
